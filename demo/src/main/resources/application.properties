spring.application.name=demo
server.port=8090

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:projectskateboard}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
project.jwt.base64-secret=${JWT_SECRET}
project.jwt.access-token-validity-in-seconds=86400000
project.jwt.refresh-token-validity-in-seconds=86400000

# Pagination
spring.data.web.pageable.default-page-size=6
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=true

# Gemini
gemini.api-key=${GEMINI_API_KEY}

# Google Identity
google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# dùng để yêu cầu Google cung cấp những thông tin nào của người dùng khi họ đăng nhập vào ProjectSkateBoard.
# openid	Yêu cầu xác thực theo chuẩn OpenID Connect