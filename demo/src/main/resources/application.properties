spring.application.name=demo
server.port=8090

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:projectskateboard}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
project.jwt.base64-secret=${JWT_SECRET}
project.jwt.access-token-validity-in-seconds=86400000
project.jwt.refresh-token-validity-in-seconds=86400000

# Pagination
spring.data.web.pageable.default-page-size=6
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=true

# Gemini
gemini.api-key=${GEMINI_API_KEY}